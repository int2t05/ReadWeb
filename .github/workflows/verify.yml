name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-assets/package-lock.json

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install renderer dependencies
        working-directory: web-assets
        run: npm ci

      - name: Test renderer and audit dependencies
        working-directory: web-assets
        run: |
          npm test
          npm audit --audit-level=high

      - name: Check generated Markdown assets
        working-directory: web-assets
        run: |
          npm run sync-assets
          git -C .. diff --exit-code -- \
            app/src/main/assets/markdown-it.min.js \
            app/src/main/assets/markdown-renderer.js \
            app/src/main/assets/THIRD-PARTY-NOTICES.txt \
            app/src/main/assets/licenses/

      - name: Test, lint, and build Android app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
