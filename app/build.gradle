plugins {
    alias(libs.plugins.android.application)
}

def releaseStoreFile = providers.environmentVariable('READWEB_RELEASE_STORE_FILE').orNull
def releaseStorePassword = providers.environmentVariable('READWEB_RELEASE_STORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('READWEB_RELEASE_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('READWEB_RELEASE_KEY_PASSWORD').orNull
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isBlank() }

android {
    namespace = 'io.github.int2t05.readweb'
    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.int2t05.readweb'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'

    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }

    lint {
        abortOnError = true
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.webkit
    testImplementation libs.junit
}
